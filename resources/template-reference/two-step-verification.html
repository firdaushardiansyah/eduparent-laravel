
<!DOCTYPE html>
<html lang="en">

<head>

	<!-- Meta Tags -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Dleohr is a clean and modern human resource management admin dashboard template which is based on HTML 5, Bootstrap 5. Try Demo and Buy Now!">
	<meta name="keywords" content="admin, estimates, bootstrap, business, corporate, creative, management, minimal, modern, accounts, invoice, html5, responsive, CRM, Projects">
    <title>Two Step  Verification | Dleohr</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="Dreams Technologies">
	
    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/img/favicon.png">

    <!-- Apple Icon -->
    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">

    <!-- Tabler Icon CSS -->
    <link rel="stylesheet" href="assets/plugins/tabler-icons/tabler-icons.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="assets/css/style.css" id="app-style">

</head>

<body>

    <!-- Begin Wrapper -->
    <div class="main-wrapper auth-bg position-relative overflow-hidden">

        <!-- Start Content -->
		<div class="container-fuild position-relative z-1">
			<div class="w-100 overflow-hidden position-relative flex-wrap d-block vh-100">

				<!-- start row -->
				<div class="row justify-content-center align-items-center vh-100 overflow-auto flex-wrap py-3">

					<div class="col-lg-4 mx-auto">
						<form action="login.html" class="digit-group d-flex justify-content-center align-items-center">
							<div class="d-flex flex-column justify-content-lg-center p-4 p-lg-0 pb-0 flex-fill">
								<div class=" mx-auto mb-5 text-center">
									<img src="assets/img/logo.svg" class="img-fluid" width="100" alt="Logo">
								</div>
								<div class="card border-0 p-lg-3">
									<div class="card-body">
										<div class="text-center mb-3">
											<h5 class="mb-1 fw-bold">2 Step Verification</h5>
											<p class="mb-0">Please enter the OTP received to confirm your account ownership. A code has been send to ******doe@example.com</p>
										</div>
										<div class="text-center otp-input">
											<div class="d-flex align-items-center justify-content-center mb-3">
												<input type="text" class=" rounded text-center fs-26 fw-bold me-3" id="digit-1" name="digit-1" data-next="digit-2" maxlength="1">
												<input type="text" class=" rounded text-center fs-26 fw-bold me-3" id="digit-2" name="digit-2" data-next="digit-3" data-previous="digit-1" maxlength="1">
												<input type="text" class=" rounded text-center fs-26 fw-bold me-3" id="digit-3" name="digit-3" data-next="digit-4" data-previous="digit-2" maxlength="1">
												<input type="text" class=" rounded text-center fs-26 fw-bold" id="digit-4" name="digit-4" data-next="digit-5" data-previous="digit-3" maxlength="1">
											</div>
											<div class="d-flex justify-content-center">
												<div class="mb-3 d-flex align-items-center ">
													<p class="me-4 mb-0">Didn't receive code. <a href="javascript:void(0);" class="text-primary">Resend Code</a></p>
													<span class="text-danger">00:45</span>
												</div>
											</div>
										</div>
										<div>
											<button type="submit" class="btn btn-primary w-100">Submit</button>
										</div>
									</div>
								</div>
							</div>
						</form>
					</div><!-- end col -->
				</div>
				<!-- end row -->
			</div>
		</div>
		<!-- End Content -->
    </div>
    <!-- End Wrapper -->

	<!-- jQuery -->
	<script src="assets/js/jquery-3.7.1.min.js"></script>

	<!-- Bootstrap Core JS -->
	<script src="assets/js/bootstrap.bundle.min.js"></script>    

	<!-- Main JS -->
	<script src="assets/js/otp.js"></script>
	<script src="assets/js/script.js"></script>

</body>

</html>
